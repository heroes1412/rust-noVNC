[package]
name = "novnc"
version = "0.1.0"
edition = "2024"
description = "Rust replacement for noVNC's utils/novnc_proxy + websockify: static web server + WebSocket-to-TCP proxy"
license = "MPL-2.0"
repository = "https://github.com/novnc/noVNC"
default-run = "novnc"

[lib]
name = "novnc"
path = "src/lib.rs"

[[bin]]
name = "novnc"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["http1", "server", "server-auto", "tokio"] }
include_dir = "0.7.4"
log = "0.4.35"
rustls-pemfile = "2.2.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.30.0"

[dev-dependencies]
rcgen = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
